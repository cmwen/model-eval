messages:
  - role: system
    content: |
      You are an assistant with excellent memory and attention.
      Read the provided context carefully and answer questions accurately.
  - role: user
    content: "{{context}}\n\nQuestion: {{query}}"
model: openai/gpt-4o
testData:
  # Basic Context Retrieval
  - context: "datasets/contexts/short_article.txt"
    query: "What is the main argument of the article?"
    expected: "Summary of main argument"
    category: "basic_retrieval"
    difficulty: "easy"
    context_length: "short"
  
  # Needle in Haystack - Beginning
  - context: "datasets/contexts/long_document_needle_beginning.txt"
    query: "What was the secret code mentioned at the start of the document?"
    expected: "The exact code that was placed at the beginning"
    category: "needle_beginning"
    difficulty: "medium"
    context_length: "long"
    needle_position: "beginning"
  
  # Needle in Haystack - Middle
  - context: "datasets/contexts/long_document_needle_middle.txt"
    query: "What was the secret code mentioned in the middle of the document?"
    expected: "The exact code that was placed in the middle"
    category: "needle_middle"
    difficulty: "hard"
    context_length: "long"
    needle_position: "middle"
  
  # Needle in Haystack - End
  - context: "datasets/contexts/long_document_needle_end.txt"
    query: "What was the secret code mentioned at the end of the document?"
    expected: "The exact code that was placed at the end"
    category: "needle_end"
    difficulty: "medium"
    context_length: "long"
    needle_position: "end"
  
  # Multi-Document Synthesis
  - context: "datasets/contexts/multiple_articles.txt"
    query: "What are the common themes across all the articles provided?"
    expected: "Synthesis of common themes from multiple documents"
    category: "multi_document"
    difficulty: "hard"
    context_length: "medium"
  
  # Specific Fact Retrieval
  - context: "datasets/contexts/research_paper.txt"
    query: "What was the sample size used in the study?"
    expected: "Exact number from the paper"
    category: "specific_fact"
    difficulty: "medium"
    context_length: "medium"
  
  # Counting/Enumeration
  - context: "datasets/contexts/list_document.txt"
    query: "How many items were mentioned in the list?"
    expected: "Exact count"
    category: "counting"
    difficulty: "medium"
    context_length: "medium"
  
  # Contradiction Detection
  - context: "datasets/contexts/contradictory_doc.txt"
    query: "Are there any contradictions in the information provided?"
    expected: "Identification of contradictory statements"
    category: "contradiction"
    difficulty: "hard"
    context_length: "medium"
  
  # Summarization
  - context: "datasets/contexts/long_report.txt"
    query: "Summarize this report in 3 key points."
    expected: "Three concise, accurate key points"
    category: "summarization"
    difficulty: "medium"
    context_length: "long"
  
  # Code Context
  - context: "datasets/contexts/large_codebase.txt"
    query: "What function handles user authentication?"
    expected: "Name and description of authentication function"
    category: "code_context"
    difficulty: "hard"
    context_length: "long"

evaluators:
  - name: RecallAccuracy
    uses: custom/recall-evaluator
    description: Measures information retrieval accuracy
  
  - name: Groundedness
    uses: azure-ai-evaluation/groundedness
    description: Verifies answers are grounded in context
  
  - name: PositionAnalysis
    uses: custom/position-bias
    description: Checks for position-based performance differences

notes: |
  To run these tests:
  1. Create context files in datasets/contexts/
  2. Use varying lengths (1K, 4K, 16K, 64K+ tokens)
  3. Place "needles" at different positions
  4. Test with and without distractors
