messages:
  - role: system
    content: |
      You are an assistant with access to the following tools:
      
      1. get_weather(location: string, units?: "celsius"|"fahrenheit") -> {temp, conditions, humidity}
      2. search_database(query: string, limit?: number, filters?: object) -> {results: array}
      3. send_email(to: string, subject: string, body: string, cc?: string[]) -> {success: boolean, messageId: string}
      4. calculate(expression: string) -> {result: number}
      5. get_user_info(userId: string) -> {name, email, role, department}
      
      When a tool is needed, respond with a JSON object:
      {"tool": "tool_name", "arguments": {...}}
  - role: user
    content: "{{query}}"
model: openai/gpt-4o
testData:
  # Simple Tool Call
  - query: "What's the weather like in Tokyo?"
    expected: |
      {"tool": "get_weather", "arguments": {"location": "Tokyo"}}
    category: "simple_call"
    difficulty: "easy"
  
  - query: "What's the temperature in Paris in Fahrenheit?"
    expected: |
      {"tool": "get_weather", "arguments": {"location": "Paris", "units": "fahrenheit"}}
    category: "with_optional_param"
    difficulty: "easy"
  
  # Database Queries
  - query: "Find the top 5 customers who made purchases last month"
    expected: |
      {"tool": "search_database", "arguments": {"query": "customers with purchases last month", "limit": 5, "filters": {"timeRange": "last_month"}}}
    category: "database_query"
    difficulty: "medium"
  
  # Email Composition
  - query: "Send an email to john@example.com about the project update, let him know we're on track for the Friday deadline. CC the team leads."
    expected: |
      {"tool": "send_email", "arguments": {"to": "john@example.com", "subject": "Project Update", "body": "Hi John,\n\nI wanted to let you know that we're on track for the Friday deadline.\n\nBest regards", "cc": ["team-leads@example.com"]}}
    category: "email"
    difficulty: "medium"
  
  # Calculations
  - query: "What is 15% of 230 plus 45?"
    expected: |
      {"tool": "calculate", "arguments": {"expression": "0.15 * 230 + 45"}}
    category: "calculation"
    difficulty: "easy"
  
  # Tool Selection
  - query: "I need information about user ID 'usr_12345'"
    expected: |
      {"tool": "get_user_info", "arguments": {"userId": "usr_12345"}}
    category: "tool_selection"
    difficulty: "easy"
  
  # No Tool Needed
  - query: "What is the capital of France?"
    expected: "Paris (no tool needed - this is general knowledge)"
    category: "no_tool"
    difficulty: "easy"
  
  # Ambiguous Request
  - query: "Tell me about the weather"
    expected: "I need a location to check the weather. Which city would you like me to check?"
    category: "clarification_needed"
    difficulty: "medium"
  
  # Complex Arguments
  - query: "Search for all active premium users in the sales department, show me 10 results"
    expected: |
      {"tool": "search_database", "arguments": {"query": "users", "limit": 10, "filters": {"status": "active", "tier": "premium", "department": "sales"}}}
    category: "complex_args"
    difficulty: "hard"

evaluators:
  - name: ToolSelection
    uses: custom/tool-selection
    description: Checks if correct tool was selected
  
  - name: ArgumentAccuracy
    uses: custom/argument-validator
    description: Validates argument correctness
  
  - name: JSONValidity
    uses: custom/json-validator
    description: Ensures valid JSON output
