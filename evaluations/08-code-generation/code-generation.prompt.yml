messages:
  - role: system
    content: |
      You are an expert programmer. Write clean, efficient, and well-documented code.
      Follow best practices and language conventions.
  - role: user
    content: "{{query}}"
model: openai/gpt-4o
testData:
  # Basic Algorithm
  - query: "Write a Python function to check if a string is a palindrome."
    expected: |
      def is_palindrome(s: str) -> bool:
          s = s.lower().replace(" ", "")
          return s == s[::-1]
    category: "algorithm"
    difficulty: "easy"
    language: "python"
  
  # Data Structure
  - query: "Implement a simple stack class in Python with push, pop, and peek methods."
    expected: |
      class Stack:
          def __init__(self):
              self._items = []
          
          def push(self, item):
              self._items.append(item)
          
          def pop(self):
              if not self._items:
                  raise IndexError("Stack is empty")
              return self._items.pop()
          
          def peek(self):
              if not self._items:
                  raise IndexError("Stack is empty")
              return self._items[-1]
          
          def is_empty(self):
              return len(self._items) == 0
    category: "data_structure"
    difficulty: "medium"
    language: "python"
  
  # Algorithm - Medium
  - query: "Write a JavaScript function to find the nth Fibonacci number using memoization."
    expected: |
      function fibonacci(n, memo = {}) {
        if (n in memo) return memo[n];
        if (n <= 1) return n;
        memo[n] = fibonacci(n - 1, memo) + fibonacci(n - 2, memo);
        return memo[n];
      }
    category: "algorithm"
    difficulty: "medium"
    language: "javascript"
  
  # Bug Fixing
  - query: |
      Fix the bug in this Python code:
      
      def find_max(numbers):
          max_num = 0
          for num in numbers:
              if num > max_num:
                  max_num = num
          return max_num
      
      # Bug: find_max([-1, -5, -3]) returns 0 instead of -1
    expected: |
      def find_max(numbers):
          if not numbers:
              return None
          max_num = numbers[0]  # Initialize with first element, not 0
          for num in numbers:
              if num > max_num:
                  max_num = num
          return max_num
    category: "debugging"
    difficulty: "easy"
    language: "python"
  
  # Code Explanation
  - query: |
      Explain what this code does:
      
      const debounce = (fn, delay) => {
        let timeoutId;
        return (...args) => {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => fn(...args), delay);
        };
      };
    expected: |
      This is a debounce function that limits how often a function can be called.
      - Takes a function and delay (in ms) as arguments
      - Returns a wrapper function that delays execution
      - Clears previous timeout on each call, restarting the delay
      - Common use: limiting API calls during user input
    category: "explanation"
    difficulty: "medium"
    language: "javascript"
  
  # API Integration
  - query: "Write a Python function using requests to fetch data from a REST API with error handling."
    expected: |
      import requests
      from typing import Optional, Dict, Any

      def fetch_api_data(url: str, timeout: int = 30) -> Optional[Dict[Any, Any]]:
          try:
              response = requests.get(url, timeout=timeout)
              response.raise_for_status()
              return response.json()
          except requests.Timeout:
              print(f"Request timed out for {url}")
              return None
          except requests.RequestException as e:
              print(f"API request failed: {e}")
              return None
    category: "api_integration"
    difficulty: "medium"
    language: "python"
  
  # SQL Query
  - query: |
      Write a SQL query to find the top 5 customers by total order amount, 
      including their name, email, and total spent. Use tables: customers(id, name, email) 
      and orders(id, customer_id, amount, created_at)
    expected: |
      SELECT 
        c.name,
        c.email,
        SUM(o.amount) as total_spent
      FROM customers c
      JOIN orders o ON c.id = o.customer_id
      GROUP BY c.id, c.name, c.email
      ORDER BY total_spent DESC
      LIMIT 5;
    category: "sql"
    difficulty: "medium"
    language: "sql"
  
  # Complex Algorithm
  - query: "Implement binary search in Python that returns the index of the target, or -1 if not found."
    expected: |
      def binary_search(arr: list, target: int) -> int:
          left, right = 0, len(arr) - 1
          
          while left <= right:
              mid = (left + right) // 2
              if arr[mid] == target:
                  return mid
              elif arr[mid] < target:
                  left = mid + 1
              else:
                  right = mid - 1
          
          return -1
    category: "algorithm"
    difficulty: "medium"
    language: "python"

evaluators:
  - name: CodeCorrectness
    uses: custom/code-execution
    description: Runs code and verifies output
  
  - name: SyntaxValidity
    uses: custom/syntax-checker
    description: Checks for syntax errors
  
  - name: BestPractices
    uses: custom/linter-integration
    description: Checks code quality and conventions
