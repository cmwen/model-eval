messages:
  - role: system
    content: |
      You are an assistant with web browsing capabilities:
      
      Tools available:
      1. web_search(query: string, num_results?: number) -> [{title, url, snippet}]
      2. fetch_url(url: string) -> {content: string, status: number}
      3. extract_links(url: string) -> [{text, href}]
      
      When using web tools, respond with the tool call in JSON format.
      After receiving results, synthesize the information helpfully.
  - role: user
    content: "{{query}}"
model: openai/gpt-4o
testData:
  # Simple Search
  - query: "Search for the latest news about renewable energy"
    expected: |
      {"tool": "web_search", "arguments": {"query": "renewable energy news 2024", "num_results": 5}}
    category: "simple_search"
    difficulty: "easy"
  
  # Specific Information Lookup
  - query: "Find the official Python documentation for the asyncio library"
    expected: |
      {"tool": "web_search", "arguments": {"query": "Python asyncio official documentation site:docs.python.org"}}
    category: "specific_search"
    difficulty: "medium"
  
  # URL Fetching
  - query: "Get the content from https://example.com/api/docs"
    expected: |
      {"tool": "fetch_url", "arguments": {"url": "https://example.com/api/docs"}}
    category: "url_fetch"
    difficulty: "easy"
  
  # Research Task
  - query: "Research the pros and cons of electric vehicles vs hybrid vehicles"
    expected: |
      {"tool": "web_search", "arguments": {"query": "electric vehicles vs hybrid vehicles comparison pros cons", "num_results": 10}}
    category: "research"
    difficulty: "medium"
    notes: "Should search for comprehensive comparisons"
  
  # Multi-Step Web Task
  - query: "Find the GitHub repository for TensorFlow and list its main features from the README"
    expected: |
      Step 1: {"tool": "web_search", "arguments": {"query": "TensorFlow GitHub repository official"}}
      Step 2: {"tool": "fetch_url", "arguments": {"url": "https://github.com/tensorflow/tensorflow"}}
    category: "multi_step"
    difficulty: "hard"
  
  # Local Business Search
  - query: "Find coffee shops near Times Square, New York"
    expected: |
      {"tool": "web_search", "arguments": {"query": "coffee shops near Times Square New York reviews"}}
    category: "local_search"
    difficulty: "easy"
  
  # Academic Search
  - query: "Find recent research papers on transformer architectures in NLP"
    expected: |
      {"tool": "web_search", "arguments": {"query": "transformer architecture NLP research papers 2023 2024 arxiv"}}
    category: "academic_search"
    difficulty: "medium"
  
  # Link Extraction
  - query: "Get all the navigation links from the Python.org homepage"
    expected: |
      {"tool": "extract_links", "arguments": {"url": "https://www.python.org"}}
    category: "link_extraction"
    difficulty: "easy"

evaluators:
  - name: QueryQuality
    uses: custom/search-query-evaluator
    description: Assesses search query effectiveness
  
  - name: ToolSelection
    uses: custom/tool-selection
    description: Checks if correct web tool was selected
  
  - name: URLValidity
    uses: custom/url-validator
    description: Validates URL format and construction
