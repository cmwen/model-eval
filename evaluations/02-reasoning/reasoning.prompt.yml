messages:
  - role: system
    content: |
      You are a logical reasoning assistant. When solving problems:
      1. Break down the problem into steps
      2. Show your reasoning clearly
      3. State any assumptions
      4. Provide the final answer clearly marked
  - role: user
    content: "{{query}}"
model: openai/gpt-4o
testData:
  # Logical Puzzles
  - query: |
      Three people (A, B, C) are standing in a line. A is not first. B is not last. C is not first or last.
      What is the order from first to last?
    expected: "B, C, A"
    category: "logic_puzzle"
    difficulty: "medium"
    reasoning: "C can only be middle. B is not last so B is first. A is not first so A is last."
  
  - query: |
      If all roses are flowers, and some flowers fade quickly, can we conclude that some roses fade quickly?
    expected: "No, we cannot conclude that. While all roses are flowers, only 'some' flowers fade quickly, and those could be non-rose flowers."
    category: "syllogism"
    difficulty: "medium"
  
  # Mathematical Reasoning
  - query: |
      A store sells apples for $2 each and oranges for $3 each. 
      If I bought 7 fruits for $17, how many of each did I buy?
    expected: "4 apples and 3 oranges"
    category: "math_word_problem"
    difficulty: "medium"
    reasoning: "Let a = apples, o = oranges. a + o = 7 and 2a + 3o = 17. Solving: a = 4, o = 3"
  
  - query: |
      A train travels from City A to City B at 60 mph. 
      The return trip is at 40 mph. 
      What is the average speed for the entire round trip?
    expected: "48 mph"
    category: "math_reasoning"
    difficulty: "hard"
    reasoning: "Average speed = 2*60*40/(60+40) = 4800/100 = 48 mph. Common mistake is (60+40)/2 = 50"
  
  # Analytical Reasoning
  - query: |
      A company's revenue increased by 20% in Q1 and decreased by 20% in Q2.
      Is the revenue at the end of Q2 equal to, greater than, or less than the starting revenue?
    expected: "Less than the starting revenue (96% of original)"
    category: "analytical"
    difficulty: "medium"
    reasoning: "If start = 100, after Q1 = 120, after Q2 = 120 * 0.8 = 96"
  
  - query: |
      Five houses in a row are painted different colors. 
      The red house is immediately to the left of the white house.
      The blue house is in the middle.
      The green house is on the far left.
      What color is the house on the far right?
    expected: "We need more information. The yellow house position is not specified relative to others."
    category: "constraint_satisfaction"
    difficulty: "hard"
  
  # Common Sense Reasoning
  - query: |
      If I put ice cream in the freezer and pizza in the oven, 
      which one will be colder after an hour?
    expected: "The ice cream in the freezer will be colder."
    category: "common_sense"
    difficulty: "easy"
  
  - query: |
      A farmer has 17 sheep. All but 9 run away. How many sheep does the farmer have left?
    expected: "9 sheep"
    category: "trick_question"
    difficulty: "easy"
    reasoning: "'All but 9' means 9 remain"
  
  # Multi-step Reasoning
  - query: |
      In a tournament, each team plays every other team exactly once.
      If there are 8 teams, how many total games are played?
    expected: "28 games"
    category: "combinatorics"
    difficulty: "medium"
    reasoning: "C(8,2) = 8!/(2!*6!) = 8*7/2 = 28"

evaluators:
  - name: Coherence
    uses: azure-ai-evaluation/coherence
    description: Measures logical flow of reasoning
  
  - name: Relevance
    uses: github/relevance
    description: Measures if reasoning addresses the problem
  
  - name: Correctness
    uses: custom/answer-correctness
    description: Checks if final answer is correct
