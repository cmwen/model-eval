messages:
  - role: system
    content: |
      You are a multilingual assistant fluent in many languages.
      Respond in the same language as the user's query unless asked to translate.
  - role: user
    content: "{{query}}"
model: openai/gpt-4o
testData:
  # Spanish
  - query: "¿Cuál es la capital de España?"
    expected: "Madrid"
    expected_language: "spanish"
    category: "qa_spanish"
    difficulty: "easy"
  
  - query: "Translate 'The quick brown fox jumps over the lazy dog' to Spanish"
    expected: "El rápido zorro marrón salta sobre el perro perezoso"
    category: "translation_to_spanish"
    difficulty: "easy"
  
  # French
  - query: "Expliquez brièvement la Révolution française."
    expected: "A brief explanation of the French Revolution in French"
    expected_language: "french"
    category: "qa_french"
    difficulty: "medium"
  
  # German
  - query: "Was ist der Unterschied zwischen 'Kennen' und 'Wissen'?"
    expected: "Explanation in German about the difference between kennen (familiarity) and wissen (factual knowledge)"
    expected_language: "german"
    category: "language_nuance"
    difficulty: "medium"
  
  # Chinese (Simplified)
  - query: "请用中文解释什么是人工智能。"
    expected: "An explanation of AI in Simplified Chinese"
    expected_language: "chinese_simplified"
    category: "qa_chinese"
    difficulty: "medium"
  
  # Japanese
  - query: "日本の四季について教えてください。"
    expected: "Information about Japan's four seasons in Japanese"
    expected_language: "japanese"
    category: "qa_japanese"
    difficulty: "medium"
  
  # Translation - Complex
  - query: |
      Translate this idiomatic expression to French, maintaining the meaning:
      "It's raining cats and dogs"
    expected: "Il pleut des cordes (or similar French idiom for heavy rain)"
    category: "idiomatic_translation"
    difficulty: "hard"
  
  # Cross-lingual Understanding
  - query: "What does 'Schadenfreude' mean? Explain in English."
    expected: "Pleasure derived from another person's misfortune - a German word with no direct English equivalent"
    category: "cross_lingual"
    difficulty: "easy"
  
  # Code-Switching
  - query: "Puedes help me with my español homework por favor?"
    expected: "Should understand mixed Spanish/English and respond helpfully"
    category: "code_switching"
    difficulty: "medium"
  
  # Korean
  - query: "한국의 전통 음식에 대해 알려주세요."
    expected: "Information about traditional Korean food in Korean"
    expected_language: "korean"
    category: "qa_korean"
    difficulty: "medium"
  
  # Arabic
  - query: "ما هي أهم المعالم السياحية في مصر؟"
    expected: "Information about tourist landmarks in Egypt in Arabic"
    expected_language: "arabic"
    category: "qa_arabic"
    difficulty: "medium"
  
  # Technical Translation
  - query: |
      Translate this technical text to German:
      "Machine learning is a subset of artificial intelligence that enables systems to learn from data."
    expected: "Maschinelles Lernen ist ein Teilbereich der künstlichen Intelligenz, der es Systemen ermöglicht, aus Daten zu lernen."
    category: "technical_translation"
    difficulty: "hard"

evaluators:
  - name: LanguageDetection
    uses: custom/language-detector
    description: Verifies response is in correct language
  
  - name: TranslationQuality
    uses: custom/bleu-score
    description: Measures translation accuracy
  
  - name: Fluency
    uses: azure-ai-evaluation/fluency
    description: Measures naturalness of language
