messages:
  - role: system
    content: |
      You are an audio processing assistant capable of:
      - Transcribing speech to text
      - Analyzing audio content
      - Identifying speakers
      - Extracting key information from audio
      
      Provide accurate transcriptions and analysis.
  - role: user
    content:
      - type: text
        text: "{{query}}"
      - type: audio_url
        audio_url:
          url: "{{audio_url}}"
model: openai/gpt-4o-audio-preview
testData:
  # Basic Transcription
  - query: "Please transcribe this audio clip."
    audio_url: "datasets/audio/clear_speech.mp3"
    expected: "Accurate word-for-word transcription"
    category: "basic_transcription"
    difficulty: "easy"
  
  # Accented Speech
  - query: "Transcribe this audio with attention to accuracy."
    audio_url: "datasets/audio/accented_speech.mp3"
    expected: "Accurate transcription despite accent"
    category: "accented_speech"
    difficulty: "medium"
  
  # Multiple Speakers
  - query: "Transcribe this conversation and identify different speakers."
    audio_url: "datasets/audio/two_speakers.mp3"
    expected: |
      Speaker 1: [text]
      Speaker 2: [text]
    category: "multi_speaker"
    difficulty: "medium"
  
  # Background Noise
  - query: "Transcribe this audio. There may be some background noise."
    audio_url: "datasets/audio/noisy_recording.mp3"
    expected: "Best effort transcription with noise handling"
    category: "noisy_audio"
    difficulty: "hard"
  
  # Meeting Summary
  - query: "Listen to this meeting recording and provide a summary with action items."
    audio_url: "datasets/audio/meeting_recording.mp3"
    expected: |
      Summary: [meeting overview]
      Action Items:
      - [action 1]
      - [action 2]
      Decisions Made:
      - [decision 1]
    category: "meeting_analysis"
    difficulty: "hard"
  
  # Technical Content
  - query: "Transcribe this technical presentation about machine learning."
    audio_url: "datasets/audio/technical_talk.mp3"
    expected: "Accurate transcription including technical terms"
    category: "technical_content"
    difficulty: "hard"
  
  # Non-English Audio
  - query: "Transcribe this Spanish audio clip."
    audio_url: "datasets/audio/spanish_speech.mp3"
    expected: "Accurate Spanish transcription"
    category: "multilingual"
    difficulty: "medium"
  
  # Audio Description
  - query: "What sounds can you hear in this audio clip?"
    audio_url: "datasets/audio/ambient_sounds.mp3"
    expected: "Identification of distinct sounds and their characteristics"
    category: "sound_identification"
    difficulty: "medium"
  
  # Emotional Tone
  - query: "What is the emotional tone of the speaker in this audio?"
    audio_url: "datasets/audio/emotional_speech.mp3"
    expected: "Identification of emotional state (happy, sad, angry, neutral, etc.)"
    category: "emotion_detection"
    difficulty: "medium"

evaluators:
  - name: WER
    uses: custom/word-error-rate
    description: Measures transcription accuracy
  
  - name: SemanticAccuracy
    uses: azure-ai-evaluation/similarity
    description: Semantic similarity to ground truth
  
  - name: Completeness
    uses: custom/transcription-completeness
    description: Checks if full audio was transcribed

notes: |
  To run these tests:
  1. Add test audio files to datasets/audio/
  2. Update audio_url paths accordingly
  3. Requires models with audio input capabilities
  4. Consider using Whisper API for baseline comparisons
