# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: "Route requests to the current min-kb-store agent"

prompts:
  - file://prompts/agent-routing.txt

providers:
  - id: openai:chat:ministral-3-8b-instruct-2512
    config:
      apiBaseUrl: http://localhost:1234/v1
      temperature: 0

tests:
  - vars:
      request: "I need an evidence-based investigation of a changing topic with source notes."
    assert:
      - type: icontains
        value: agent-researcher

  - vars:
      request: "Can you help me write a new LogSeq page for a project idea?"
    assert:
      - type: icontains
        value: agent-logseq

  - vars:
      request: "Please checkpoint these repos and push only after the build passes."
    assert:
      - type: icontains
        value: agent-maintenance-runner

  - vars:
      request: "I need help solving a quadratic equation step by step."
    assert:
      - type: icontains
        value: agent-math-tutor

  - vars:
      request: "Help me plan a job search and decide between roles."
    assert:
      - type: icontains
        value: agent-career-coach

  - vars:
      request: "Just chat with me about a random day-to-day question."
    assert:
      - type: icontains
        value: agent-general-chat
