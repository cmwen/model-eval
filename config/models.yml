# Model Configurations
# Define models to evaluate and their settings

# Default configuration for Ollama (local)
default:
  provider: ollama
  base_url: http://localhost:11434
  # Can be overridden with environment variables:
  # OLLAMA_BASE_URL, LITELLM_API_BASE, AI_PROXY_URL

models:
  # Ollama Models (Local) - PRIMARY EVALUATION TARGETS
  - id: ollama/gpt-oss:20b
    name: GPT-OSS 20B (OpenAI Open Weight)
    provider: ollama
    capabilities:
      - text
      - reasoning
      - tool_calling
    context_window: 128000
    cost_per_1k_input: 0.0  # Local inference
    cost_per_1k_output: 0.0
    notes: "Default model - OpenAI's open-weight model with excellent reasoning"
    is_default: true

  - id: ollama/gpt-oss:120b
    name: GPT-OSS 120B (OpenAI Open Weight)
    provider: ollama
